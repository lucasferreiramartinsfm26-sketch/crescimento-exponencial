name: Deploy delete-account Edge Function

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/delete-account/**'
      - '.github/workflows/deploy-delete-account.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.39.2

      - name: Deploy delete-account function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy delete-account --project-ref wxjhxheonexietlkqlke --yes
